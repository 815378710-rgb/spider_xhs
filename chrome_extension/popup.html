<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 380px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; }
.header { background: linear-gradient(135deg, #ff2442, #ff6b81); padding: 18px; text-align: center; color: #fff; }
.header h1 { font-size: 16px; margin-bottom: 3px; }
.header p { font-size: 11px; opacity: 0.8; }
.content { padding: 14px; }
.status-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #f0f0f0; }
.status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.status-row:last-child { margin-bottom: 0; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-green { background: #10b981; }
.dot-yellow { background: #f59e0b; animation: pulse 1.5s infinite; }
.dot-red { background: #ef4444; }
.status-text { font-size: 12px; color: #555; }
.btn { width: 100%; padding: 11px; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: linear-gradient(135deg, #ff2442, #ff6b81); color: #fff; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(255,36,66,0.3); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-secondary { background: #f5f5f7; color: #555; border: 1px solid #e5e5e7; font-size: 12px; }
.btn-secondary:hover { background: #eee; }
.config-row { display: flex; gap: 6px; margin-bottom: 10px; }
.config-row input { flex: 1; padding: 8px 10px; border: 1px solid #e5e5e7; border-radius: 8px; font-size: 12px; outline: none; }
.config-row input:focus { border-color: #ff2442; }
.msg { padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-top: 8px; text-align: center; white-space: pre-line; }
.msg-success { background: #ecfdf5; color: #059669; }
.msg-error { background: #fef2f2; color: #dc2626; }
.msg-info { background: #eff6ff; color: #2563eb; }
.footer { padding: 10px 16px; text-align: center; font-size: 11px; color: #999; border-top: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
.refresh-link { color: #ff2442; cursor: pointer; text-decoration: none; font-size: 11px; }
.refresh-link:hover { text-decoration: underline; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
/* Toggle switch */
.toggle-wrap input:checked + #proxySlider { background: #ff2442; }
.toggle-wrap input:checked + #proxySlider + #proxyDot { transform: translateX(18px); }
</style>
</head>
<body>
  <div class="header">
    <h1>🥔 小红书 Cookie 采集器</h1>
    <p>配合「土豆小红书助手」使用</p>
  </div>

  <div class="content">
    <!-- 状态卡片 -->
    <div class="status-card">
      <div class="status-row">
        <div id="dot-xhs" class="status-dot dot-yellow"></div>
        <span id="status-xhs" class="status-text">检测小红书登录状态...</span>
      </div>
      <div class="status-row">
        <div id="dot-server" class="status-dot dot-yellow"></div>
        <span id="status-server" class="status-text">检测服务端连接...</span>
      </div>
    </div>

    <!-- 服务器地址配置 -->
    <div class="config-row">
      <input type="text" id="serverUrl" placeholder="服务端地址 (如 http://192.168.68.162:5000)">
      <button onclick="saveServerUrl()" class="btn btn-secondary" style="width:auto;padding:8px 12px;font-size:12px;white-space:nowrap">💾 保存</button>
    </div>

    <!-- 一键采集按钮 -->
    <button id="btnCollect" onclick="collectCookie()" class="btn btn-primary" disabled>
      🍪 一键采集 Cookie
    </button>

    <div style="margin-top: 10px">
      <div class="status-card" style="padding:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:12px;font-weight:600;color:#333">🔄 浏览器代理转发</span>
          <label style="position:relative;display:inline-block;width:40px;height:22px;cursor:pointer">
            <input type="checkbox" id="proxyToggle" onchange="toggleProxy()" style="opacity:0;width:0;height:0">
            <span style="position:absolute;inset:0;background:#ccc;border-radius:22px;transition:.3s" id="proxySlider"></span>
            <span style="position:absolute;left:3px;top:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.3s" id="proxyDot"></span>
          </label>
        </div>
        <div style="font-size:11px;color:#888;line-height:1.4">
          开启后：浏览器实时监听小红书请求，服务端通过浏览器转发 API 调用，绕过反爬检测。
        </div>
        <div id="proxyStats" style="font-size:11px;color:#666;margin-top:4px"></div>
      </div>
    </div>

    <div id="msg" class="msg" style="display:none"></div>
  </div>

  <div class="footer">
    <span>v2.0.0</span>
    <a class="refresh-link" onclick="manualRefresh()">🔄 刷新状态</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
